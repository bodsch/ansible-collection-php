---

# choose your version!
php_version: "8"

# fpr arch based distributions
php_package_name: "php"  # also php-legacy

# PHP package state; use 'present' to make sure it's installed, or 'latest' if
# you want to upgrade or switch versions using a new repo.
php_packages_state: present

php_fpm_log_directory: /var/log/php-fpm
php_fpm_tmp_upload_directory: /tmp/php-fpm
php_fpm_socket_directory: /run/php-fpm

php_fpm_global: {}

# Possible Values: alert, error, warning, notice, debug
php_fpm_log_level: notice

# PHP-FPM configuration.
php_enable_php_fpm: true

php_fpm_listen: "127.0.0.1:9000"
php_fpm_listen_allowed_clients: "127.0.0.1"

php_fpm_pm:
  max_children: 50
  start_servers: 5
  spare_servers:
    min: 5
    max: 5

# Manage the distribution PHP repository (Debian: deb.sury.org).
# Set to false to let a dedicated role handle repository setup.
fpm_manage_repository: true

# NOTE: php.ini is not managed by this role. The php.ini value knobs that used
# to live here (php_memory_limit, php_expose_php, php_session_*, ...) were
# removed; use the bodsch.php.ini role with php_ini / php_ini_sapi instead.

# optional php packages
# for archlinux and use of `php-legacy` these package names can automatic expanded with `legacy`
# e.g. php-gd would be php-legacy-gd and so on
php_packages: []

# OBSOLETE
# replaced by `php_packages`
php_custom_packages: []

php_fpm_default_pool:
  delete: false
  name: www.conf

# for example
php_fpm_pools: []
#   - name: worker-01
#     user: "{{ php_fpm_pool_user }}"
#     group: "{{ php_fpm_pool_group }}"
#     listen.owner: "{{ php_fpm_pool_user }}"
#     listen.group: "{{ php_fpm_pool_group }}"
#     listen: "{{ php_fpm_socket_directory }}/$poolck"
#     # static, dynamic or ondemand
#     pm: dynamic
#     pm.max_children: 10
#     pm.start_servers: 4
#     pm.min_spare_servers: 2
#     pm.max_spare_servers: 6
#     env:
#       MASTER: '"true"'
#     php_flag:
#       display_errors: "on"

# php modules
php_modules: []
#   - name: pdo_mysql
#     enabled: true
#     priority: 20
#     content: |
#       extension=pdo_mysql
