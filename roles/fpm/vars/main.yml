---

systemd_lib_directory: ""

php_defaults_packages: []

php_dependencies: []

php_conf_paths: []

php_extension_conf_paths: []

php_fpm_defaults_global:
  pid: "{{ php_fpm_socket_directory }}/php-fpm.pid"
  error_log: "{{ php_fpm_log_directory }}/error.log"
  syslog:
    facility: ""                                  # daemon
    ident: ""                                     # php-fpm
  log:
    level: notice
    limit: ""                                     # 4096
    buffering: false                              # no
  emergency_restart:
    threshold: ""                                 # 0
    interval: ""                                  # 0
  process:
    control_timeout: ""                           # 0
    max: ""                                       # 128
    priority: ""                                  # -19
  daemonize: ""                                   # yes
  rlimit:
    files: ""                                     # 1024
    core: ""                                      # 0
  events:
    mechanism: ""                                 # epoll
  systemd_interval: ""                            # 10

php_fpm_daemon: ""

php_fpm_pool_user_default: ""

php_fpm_conf_path: ""

php_fpm_pool_conf_path: ""

php_webserver_daemon: ""

php_modules_conf_paths: ""

...
