---

php_pecl_extensions:
  # redis is well maintained and builds against current PHP releases.
  # No version is pinned so PECL installs the latest compatible release.
  - name: redis

  # memcached needs its build dependencies (including the zlib headers) and is
  # installed non-interactively via configure_options, which answer PECL's
  # interactive configure prompts in order.
  - name: memcached
    dependencies:
      - libmemcached-dev
      - zlib1g-dev
    configure_options:
      - ""      # libmemcached directory -> default (auto detect)
      - "/usr"  # zlib directory

...
