---

# Manage the distribution PHP repository (Debian: deb.sury.org).
# Set to false to let a dedicated role handle repository setup.
php_manage_repository: true

# choose your version!
php_version: "8"

# default are 'php'
# fpr archlinu, you can choose also 'php-lecacy'
php_package_name: "php"

php_packages_state: present

php_packages: []
# OBSOLETE
# replaced by `php_packages`
# php_custom_packages: []
