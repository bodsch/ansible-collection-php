---

php_modules:
  - name: opcache
    enabled: true
    priority: 10
    content: |
      zend_extension=opcache
      opcache.enable=1
      opcache.enable_cli=1
      opcache.memory_consumption=128
      opcache.interned_strings_buffer=16
      opcache.max_accelerated_files=10000
      opcache.max_wasted_percentage=5
      opcache.validate_timestamps=1
      opcache.revalidate_path=0
      opcache.revalidate_freq=1
      opcache.max_file_size=0
  - name: pdo_mysql
    enabled: true
    priority: 20
    content: |
      extension=pdo_mysql
  - name: apcu
    enabled: false
    priority: 20
    content: |
      extension=apcu
      apc.shm_size=96M
      apc.enable_cli=0
      apc.rfc1867=1
  - name: gd
    enabled: true
    priority: 20
    content: |
      extension=gd
  - name: memcached
    enabled: false
    priority: 20
    content: |
      extension=memcached
  - name: xmlrpc
    enabled: "{{ 'false' if ansible_facts.os_family | lower == 'archlinux' else 'true' }}"
    priority: 20
    content: |
      extension=xmlrpc
  - name: sqlite3
    enabled: false
    priority: 20
    content: |
      extension=sqlite3
      extension=pdo_sqlite
  - name: pdo_mysql
    enabled: false
    priority: 30

php_packages: []
  #- php-gd
  #- php-intl
  # - php-sqlite
